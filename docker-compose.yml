# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:17-alpine
    container_name: vitalyn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitalyn
      POSTGRES_PASSWORD: vitalyn
      POSTGRES_DB: vitalyn
    ports:
      - "5432:5432"
    volumes:
      - vitalyn-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalyn"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vitalyn-pg:
